<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A arte de criar ofertas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Vídeo de fundo */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay escuro para melhor legibilidade do texto */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* Conteúdo da capa */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 3;
            width: 90%;
            max-width: 800px;
        }

        /* Título */
        .title {
            font-size: clamp(32px, 8vw, 64px);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        /* Botão */
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-size: clamp(14px, 3vw, 18px);
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Controles de áudio — canto inferior direito */
        .audio-controls {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Slider de volume — aparece ao hover ou clique */
        .volume-slider-wrap {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 6px 14px;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .audio-controls:hover .volume-slider-wrap,
        .audio-controls.open .volume-slider-wrap {
            opacity: 1;
            pointer-events: all;
            transform: translateX(0);
        }

        .volume-icon {
            color: #fff;
            font-size: 13px;
            opacity: 0.8;
        }

        input[type="range"].volume-range {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.3);
            outline: none;
            cursor: pointer;
        }

        input[type="range"].volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
        }

        input[type="range"].volume-range::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }

        /* Botão de mute/volume */
        .audio-btn {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            font-size: 18px;
            flex-shrink: 0;
        }

        .audio-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* Tela de início (para autoplay policy) */
        .start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        .start-screen h2 {
            color: #fff;
            font-size: clamp(18px, 4vw, 28px);
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.7);
        }

        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .content { width: 95%; }
            .title { margin-bottom: 30px; }
            .btn { padding: 14px 32px; }
        }

        @media (max-width: 480px) {
            .title { margin-bottom: 25px; }
            .btn { padding: 12px 28px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Tela de início para contornar política de autoplay dos navegadores -->
    <div class="start-screen" id="startScreen">
        <h2>Clique para entrar na experiência</h2>
        <button class="start-btn" onclick="startExperience()">▶ Entrar</button>
    </div>

    <div class="container">
        <!-- Vídeo em looping preenchendo toda a tela -->
        <video class="video-background" id="bgVideo" muted loop playsinline>
            <source src="download.mp4" type="video/mp4">
        </video>

        <!-- Overlay para melhor legibilidade -->
        <div class="overlay"></div>

        <!-- Conteúdo: Título e Botão -->
        <div class="content">
            <h1 class="title">A arte de criar ofertas</h1>
            <a href="https://miro.com/app/board/uXjVGq89rNo=/?share_link_id=501547329678"
               class="btn"
               id="mapaBtn"
               target="_blank"
               onclick="stopAudio()">
                Abra o mapa mental
            </a>
        </div>
    </div>

    <!-- Áudio de meditação -->
    <audio id="meditacaoAudio" loop preload="auto">
        <source src="meditacao.mp3" type="audio/mpeg">
    </audio>

    <!-- Controles de áudio -->
    <div class="audio-controls" id="audioControls">
        <div class="volume-slider-wrap" id="volumeWrap">
            <span class="volume-icon">🔈</span>
            <input type="range" class="volume-range" id="volumeRange"
                   min="0" max="100" value="20"
                   oninput="changeVolume(this.value)">
            <span class="volume-icon">🔊</span>
        </div>
        <button class="audio-btn" id="audioBtn" onclick="toggleAudio()" title="Controle de volume">
            🔉
        </button>
    </div>

    <script>
        const audio = document.getElementById('meditacaoAudio');
        const video = document.getElementById('bgVideo');
        const audioBtn = document.getElementById('audioBtn');
        const startScreen = document.getElementById('startScreen');
        const audioControls = document.getElementById('audioControls');
        const volumeRange = document.getElementById('volumeRange');
        let audioMuted = false;
        let lastVolume = 0.20;

        function startExperience() {
            video.play();
            audio.volume = 0.20; // volume padrão baixo (20%)
            volumeRange.value = 20;
            audio.play();
            startScreen.classList.add('hidden');
            setTimeout(() => startScreen.remove(), 700);
        }

        function stopAudio() {
            audio.pause();
            audio.currentTime = 0;
            audioBtn.textContent = '🔇';
            audioMuted = true;
        }

        function changeVolume(val) {
            const v = val / 100;
            audio.volume = v;
            lastVolume = v;
            if (v === 0) {
                audioBtn.textContent = '🔇';
                audioMuted = true;
            } else if (v < 0.4) {
                audioBtn.textContent = '🔈';
                audioMuted = false;
            } else {
                audioBtn.textContent = '🔉';
                audioMuted = false;
            }
            if (audioMuted && v > 0) {
                audio.play();
                audioMuted = false;
            }
        }

        function toggleAudio() {
            // Abre/fecha o slider de volume
            audioControls.classList.toggle('open');
        }

        // Fechar slider ao clicar fora
        document.addEventListener('click', function(e) {
            if (!audioControls.contains(e.target)) {
                audioControls.classList.remove('open');
            }
        });
    </script>
</body>
</html>
