<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A arte de criar ofertas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Vídeo de fundo */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay escuro para melhor legibilidade do texto */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* Conteúdo da capa */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 3;
            width: 90%;
            max-width: 800px;
        }

        /* Título */
        .title {
            font-size: clamp(32px, 8vw, 64px);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        /* Botão */
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-size: clamp(14px, 3vw, 18px);
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Botão de controle de áudio */
        .audio-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            font-size: 20px;
        }

        .audio-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        /* Tela de início (para autoplay policy) */
        .start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        .start-screen h2 {
            color: #fff;
            font-size: clamp(18px, 4vw, 28px);
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.7);
        }

        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .content { width: 95%; }
            .title { margin-bottom: 30px; }
            .btn { padding: 14px 32px; }
        }

        @media (max-width: 480px) {
            .title { margin-bottom: 25px; }
            .btn { padding: 12px 28px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Tela de início para contornar política de autoplay dos navegadores -->
    <div class="start-screen" id="startScreen">
        <h2>Clique para entrar na experiência</h2>
        <button class="start-btn" onclick="startExperience()">▶ Entrar</button>
    </div>

    <div class="container">
        <!-- Vídeo em looping preenchendo toda a tela -->
        <video class="video-background" id="bgVideo" muted loop playsinline>
            <source src="download.mp4" type="video/mp4">
        </video>

        <!-- Overlay para melhor legibilidade -->
        <div class="overlay"></div>

        <!-- Conteúdo: Título e Botão -->
        <div class="content">
            <h1 class="title">A arte de criar ofertas</h1>
            <a href="https://miro.com/app/board/uXjVGq89rNo=/?share_link_id=501547329678"
               class="btn"
               id="mapaBtn"
               target="_blank"
               onclick="stopAudio()">
                Abra o mapa mental
            </a>
        </div>
    </div>

    <!-- Áudio de meditação -->
    <audio id="meditacaoAudio" loop preload="auto">
        <source src="meditacao.mp3" type="audio/mpeg">
    </audio>

    <!-- Botão de mute/unmute -->
    <button class="audio-btn" id="audioBtn" onclick="toggleAudio()" title="Ativar/desativar áudio">
        🔊
    </button>

    <script>
        const audio = document.getElementById('meditacaoAudio');
        const video = document.getElementById('bgVideo');
        const audioBtn = document.getElementById('audioBtn');
        const startScreen = document.getElementById('startScreen');
        let audioMuted = false;

        function startExperience() {
            // Inicia vídeo e áudio juntos após interação do usuário
            video.play();
            audio.volume = 0.6;
            audio.play();
            startScreen.classList.add('hidden');
            setTimeout(() => startScreen.remove(), 700);
        }

        function stopAudio() {
            // Para o áudio ao clicar no botão do mapa mental
            audio.pause();
            audio.currentTime = 0;
            audioBtn.textContent = '🔇';
        }

        function toggleAudio() {
            if (audioMuted) {
                audio.volume = 0.6;
                audio.play();
                audioBtn.textContent = '🔊';
                audioMuted = false;
            } else {
                audio.pause();
                audioBtn.textContent = '🔇';
                audioMuted = true;
            }
        }
    </script>
</body>
</html>
